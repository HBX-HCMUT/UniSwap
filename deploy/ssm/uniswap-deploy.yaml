schemaVersion: '2.2'
description: Triển khai UniSwap trên EC2 từ nhánh main.
mainSteps:
  - action: aws:runShellScript
    name: deployUniSwap
    precondition:
      StringEquals:
        - platformType
        - Linux
    inputs:
      timeoutSeconds: '1800'
      runCommand:
        - |
          set -eu
          cd /home/ec2-user/UniSwap
          if [ ! -f scripts/deploy.sh ]; then
            echo "Thiếu /home/ec2-user/UniSwap/scripts/deploy.sh. Cập nhật bản clone trên EC2 từ main trước." >&2
            exit 1
          fi
          exec runuser -u ec2-user -- /bin/bash scripts/deploy.sh
