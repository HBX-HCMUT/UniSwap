openapi: 3.0.3
info:
  title: UniSwap • API chợ đồ cũ sinh viên
  version: 0.1.0
  description: Hợp đồng thiết kế. Các endpoint có x-access=admin yêu cầu phiên quản trị.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      tags:
        - system
      summary: Kiểm tra sẵn sàng của API và DB
      operationId: getHealth
      security: []
      x-access: public
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        "503":
          $ref: '#/components/responses/Error503'
  /auth/register:
    post:
      tags:
        - auth
      summary: Đăng ký và gửi thư xác thực
      operationId: postAuthRegister
      security: []
      x-access: public
      description: Trả cùng phản hồi khi email đã tồn tại. Kiểm tra miền trường phía server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 100
              additionalProperties: false
              required:
                - email
                - password
                - displayName
      responses:
        "202":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        "400":
          $ref: '#/components/responses/Error400'
        "429":
          $ref: '#/components/responses/Error429'
  /auth/verify:
    post:
      tags:
        - auth
      summary: Xác thực email bằng token dùng một lần
      operationId: postAuthVerify
      security: []
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 1
              additionalProperties: false
              required:
                - token
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        "400":
          $ref: '#/components/responses/Error400'
        "410":
          $ref: '#/components/responses/Error410'
  /auth/resend:
    post:
      tags:
        - auth
      summary: Gửi lại thư xác thực
      operationId: postAuthResend
      security: []
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              additionalProperties: false
              required:
                - email
      responses:
        "202":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        "400":
          $ref: '#/components/responses/Error400'
        "429":
          $ref: '#/components/responses/Error429'
  /auth/login:
    post:
      tags:
        - auth
      summary: Đăng nhập và đặt cookie phiên
      operationId: postAuthLogin
      security: []
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
              additionalProperties: false
              required:
                - email
                - password
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "429":
          $ref: '#/components/responses/Error429'
  /auth/google:
    get:
      tags:
        - auth
      summary: Bắt đầu đăng nhập Google
      operationId: getAuthGoogle
      security: []
      x-access: public
      responses:
        "302":
          description: Chuyển hướng trình duyệt
          headers:
            Location:
              schema:
                type: string
              description: Đích chuyển hướng
  /auth/google/callback:
    get:
      tags:
        - auth
      summary: Kiểm tra OAuth và đặt cookie phiên
      description: Xác minh state, nonce và ID token. Cho phép các tham số bổ sung do Google trả về.
      operationId: getAuthGoogleCallback
      security: []
      x-access: public
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Chuyển hướng trình duyệt
          headers:
            Location:
              schema:
                type: string
              description: Đích chuyển hướng
        "400":
          $ref: '#/components/responses/Error400'
        "403":
          $ref: '#/components/responses/Error403'
  /auth/logout:
    post:
      tags:
        - auth
      summary: Thu hồi phiên hiện tại và xóa cookie
      operationId: postAuthLogout
      security:
        - sessionCookie: []
      x-access: student
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
  /me:
    get:
      tags:
        - users
      summary: Xem hồ sơ riêng
      operationId: getMe
      security:
        - sessionCookie: []
      x-access: student
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
    patch:
      tags:
        - users
      summary: Cập nhật hồ sơ của mình
      operationId: patchMe
      security:
        - sessionCookie: []
      x-access: student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 100
                schoolId:
                  type: string
                  format: uuid
                area:
                  type: string
                  minLength: 1
                  maxLength: 120
                contact:
                  type: string
                  minLength: 0
                  maxLength: 200
              additionalProperties: false
              minProperties: 1
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
  /users/{id}:
    get:
      tags:
        - users
      summary: Xem uy tín người dùng công khai
      operationId: getUsersId
      security: []
      x-access: public
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        "400":
          $ref: '#/components/responses/Error400'
        "404":
          $ref: '#/components/responses/Error404'
  /users/{id}/reviews:
    get:
      tags:
        - reviews
      summary: Xem đánh giá đã nhận
      operationId: getUsersIdReviews
      security: []
      x-access: public
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  total:
                    type: integer
                    minimum: 0
                additionalProperties: false
                required:
                  - items
                  - page
                  - pageSize
                  - total
        "400":
          $ref: '#/components/responses/Error400'
        "404":
          $ref: '#/components/responses/Error404'
  /schools:
    get:
      tags:
        - catalog
      summary: Danh sách trường
      operationId: getSchools
      security: []
      x-access: public
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/School'
  /categories:
    get:
      tags:
        - catalog
      summary: Danh sách danh mục đang dùng
      operationId: getCategories
      security: []
      x-access: public
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /assets:
    post:
      tags:
        - listings
      summary: Tải một ảnh và nhận ID
      operationId: postAssets
      security:
        - sessionCookie: []
      x-access: student
      description: Tối đa 5 MiB. Trên Vercel, ảnh lớn hơn 4 MiB dùng luồng /assets/upload-ticket và /assets/upload-complete. Ảnh QR trả URL đọc có kiểm tra quyền. URL ảnh tin chỉ công khai khi tin được hiển thị.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  enum:
                    - LISTING
                    - PAYMENT_QR
              additionalProperties: false
              required:
                - file
                - purpose
      responses:
        "201":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "413":
          $ref: '#/components/responses/Error413'
        "415":
          $ref: '#/components/responses/Error415'
        "429":
          $ref: '#/components/responses/Error429'
  /assets/upload-ticket:
    post:
      tags: [listings]
      operationId: postAssetUploadTicket
      summary: Cấp quyền tải một ảnh lên kho riêng tư
      description: Dùng khi kho ảnh cloud được cấu hình. Vé gắn với chủ phiên, mục đích ảnh và một đường dẫn duy nhất, hết hạn sau 10 phút.
      security:
        - sessionCookie: []
      x-access: student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              additionalProperties: false
              properties:
                purpose:
                  type: string
                  enum: [LISTING, PAYMENT_QR]
      responses:
        "201":
          description: Quyền tải một ảnh JPEG, PNG hoặc WebP tối đa 5 MiB.
          content:
            application/json:
              schema:
                type: object
                required: [pathname, clientToken, ticket]
                properties:
                  pathname: { type: string }
                  clientToken: { type: string }
                  ticket: { type: string }
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "429":
          $ref: '#/components/responses/Error429'
        "503":
          $ref: '#/components/responses/Error503'
  /assets/upload-complete:
    post:
      tags: [listings]
      operationId: postAssetUploadComplete
      summary: Xác nhận nội dung ảnh đã tải và nhận ID
      description: NestJS kiểm tra chủ vé và định dạng thực trước khi lưu metadata. Dùng lại vé hợp lệ trả cùng ảnh đã xác nhận.
      security:
        - sessionCookie: []
      x-access: student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              additionalProperties: false
              properties:
                ticket: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        "201":
          description: Ảnh đã xác nhận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "404":
          $ref: '#/components/responses/Error404'
        "413":
          $ref: '#/components/responses/Error413'
        "415":
          $ref: '#/components/responses/Error415'
        "503":
          $ref: '#/components/responses/Error503'
  /assets/{id}:
    get:
      tags:
        - listings
      summary: Đọc ảnh theo quyền hiển thị
      operationId: getAssetsId
      security:
        - {}
        - sessionCookie: []
      x-access: public
      description: Khách chỉ đọc ảnh của tin công khai. Chủ ảnh xem được bản tải lên; admin được xem ảnh tin để duyệt. Chỉ chủ ảnh và người mua trong giao dịch đã chấp thuận hoặc hoàn tất được xem QR tương ứng.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 'Nội dung ảnh sau kiểm tra quyền; QR dùng Cache-Control: private, no-store.'
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: '#/components/responses/Error400'
        "404":
          $ref: '#/components/responses/Error404'
  /listings:
    get:
      tags:
        - listings
      summary: Tìm tin đang bán
      operationId: getListings
      security: []
      x-access: public
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: schoolId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: sellerId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: area
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: minPrice
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 2000000000
        - name: maxPrice
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 2000000000
        - name: condition
          in: query
          required: false
          schema:
            type: string
            enum:
              - LIKE_NEW
              - GOOD
              - FAIR
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - NEWEST
              - PRICE_ASC
              - PRICE_DESC
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Listing'
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  total:
                    type: integer
                    minimum: 0
                additionalProperties: false
                required:
                  - items
                  - page
                  - pageSize
                  - total
        "400":
          $ref: '#/components/responses/Error400'
    post:
      tags:
        - listings
      summary: Đăng tin
      operationId: postListings
      security:
        - sessionCookie: []
      x-access: student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingInput'
      responses:
        "201":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "422":
          $ref: '#/components/responses/Error422'
  /me/listings:
    get:
      tags:
        - listings
      summary: Danh sách tin của tôi, gồm cả tin ẩn và chờ duyệt
      operationId: getMeListings
      security:
        - sessionCookie: []
      x-access: student
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Listing'
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  total:
                    type: integer
                    minimum: 0
                additionalProperties: false
                required:
                  - items
                  - page
                  - pageSize
                  - total
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
  /listings/{id}:
    get:
      tags:
        - listings
      summary: Mở chi tiết tin
      operationId: getListingsId
      security:
        - {}
        - sessionCookie: []
      x-access: public
      description: Khách xem tin công khai. Nếu có phiên của chủ tin hoặc admin, có thể xem trạng thái riêng.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        "400":
          $ref: '#/components/responses/Error400'
        "404":
          $ref: '#/components/responses/Error404'
    put:
      tags:
        - listings
      summary: Chủ tin sửa nội dung khi AVAILABLE
      operationId: putListingsId
      security:
        - sessionCookie: []
      x-access: student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingInput'
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
          $ref: '#/components/responses/Error409'
        "422":
          $ref: '#/components/responses/Error422'
  /listings/{id}/state:
    patch:
      tags:
        - listings
      summary: Chủ tin ẩn, hiện hoặc đánh dấu bán ngoài
      operationId: patchListingsIdState
      security:
        - sessionCookie: []
      x-access: student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                    - HIDE
                    - SHOW
                    - MARK_SOLD
              additionalProperties: false
              required:
                - action
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
          $ref: '#/components/responses/Error409'
  /conversations:
    post:
      tags:
        - chat
      summary: Mở hoặc lấy lại hội thoại với người bán
      operationId: postConversations
      description: Người mua có thể mở hội thoại đầu tiên khi tin còn bán hoặc khi chính mình có lịch ACCEPTED trên tin RESERVED. Hội thoại đã có được dùng lại.
      security:
        - sessionCookie: []
      x-access: student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                listingId:
                  type: string
                  format: uuid
              additionalProperties: false
              required:
                - listingId
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
          $ref: '#/components/responses/Error409'
    get:
      tags:
        - chat
      summary: Hộp thư của tôi
      operationId: getConversations
      security:
        - sessionCookie: []
      x-access: student
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
