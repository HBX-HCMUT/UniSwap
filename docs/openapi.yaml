  /reservations/{id}:
    get:
      tags:
        - reservations
      summary: Xem yêu cầu và lịch hẹn
      operationId: getReservationsId
      security:
        - sessionCookie: []
      x-access: student
      description: Chỉ người mua và chủ tin được đọc. Người ngoài nhận 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "404":
          $ref: '#/components/responses/Error404'
    patch:
      tags:
        - reservations
      summary: Chuyển trạng thái giữ hàng
      operationId: patchReservationsId
      security:
        - sessionCookie: []
      x-access: student
      description: >-
        Với PENDING, người bán ACCEPT/REJECT và người mua CANCEL. Với ACCEPTED,
        cả hai bên được CANCEL và chỉ người mua được COMPLETE sau giao nhận.
        Người ngoài nhận 404, người tham gia dùng sai vai trò nhận 403, thao tác
        trên yêu cầu đã đóng hoặc vừa mất lượt nhận 409. ACCEPT yêu cầu giờ hẹn
        trong tương lai. QR_MANUAL yêu cầu ảnh PAYMENT_QR thuộc người bán.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    action:
                      type: string
                      enum:
                        - ACCEPT
                    finalPrice:
                      type: integer
                      minimum: 0
                      maximum: 2000000000
                    meetingAt:
                      type: string
                      format: date-time
                    meetingPlace:
                      type: string
                      minLength: 1
                      maxLength: 120
                    paymentMethod:
                      type: string
                      enum:
                        - COD
                  additionalProperties: false
                  required:
                    - action
                    - finalPrice
                    - meetingAt
                    - meetingPlace
                    - paymentMethod
                - type: object
                  properties:
                    action:
                      type: string
                      enum:
                        - ACCEPT
                    finalPrice:
                      type: integer
                      minimum: 0
                      maximum: 2000000000
                    meetingAt:
                      type: string
                      format: date-time
                    meetingPlace:
                      type: string
                      minLength: 1
                      maxLength: 120
                    paymentMethod:
                      type: string
                      enum:
                        - QR_MANUAL
                    qrAssetId:
                      type: string
                      format: uuid
                  additionalProperties: false
                  required:
                    - action
                    - finalPrice
                    - meetingAt
                    - meetingPlace
                    - paymentMethod
                    - qrAssetId
                - type: object
                  properties:
                    action:
                      type: string
                      enum:
                        - CANCEL
                        - COMPLETE
                        - REJECT
                  additionalProperties: false
                  required:
                    - action
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
          $ref: '#/components/responses/Error409'
        "422":
          $ref: '#/components/responses/Error422'
