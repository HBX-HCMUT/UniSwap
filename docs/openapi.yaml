  /reservations:
    post:
      tags:
        - reservations
      summary: Gửi giữ hoặc lấy lại yêu cầu đang chờ
      operationId: postReservations
      security:
        - sessionCookie: []
      x-access: student
      description: >-
        Người mua là sinh viên đã xác thực, ACTIVE, lấy từ phiên. Có thể gửi trước khi nhắn tin.
        Chỉ nhận tin AVAILABLE, APPROVED của người bán ACTIVE. Tự giữ tin trả 403, tin ngoài
        phạm vi hiển thị trả 404, tin công khai RESERVED/SOLD trả 409. Hai lần gửi cùng tin,
        cùng người mua khi còn PENDING đều trả 200 với cùng id, kể cả khi gửi đồng thời.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                listingId:
                  type: string
                  format: uuid
              additionalProperties: false
              required:
                - listingId
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Reservation'
                  - properties:
                      state: {type: string, enum: [PENDING]}
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
          $ref: '#/components/responses/Error409'
    get:
      tags:
        - reservations
      summary: Các yêu cầu của tôi
      operationId: getReservations
      security:
        - sessionCookie: []
      x-access: student
      description: >-
        Chỉ lấy giao dịch mà chủ phiên là người mua hoặc người bán. Khi lọc theo hội thoại,
        kiểm tra quyền thành viên trước rồi lọc theo cả listingId và buyerId của hội thoại.
        Xếp PENDING/ACCEPTED trước lịch sử, rồi theo createdAt và id giảm dần trước khi phân trang.
      parameters:
        - name: conversationId
          in: query
          description: Hội thoại của chủ phiên. Hội thoại chưa có yêu cầu giữ trả trang rỗng.
          schema:
            type: string
            format: uuid
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum:
              - BUYER
              - SELLER
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - ACCEPTED
              - REJECTED
              - CANCELLED
              - COMPLETED
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reservation'
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  total:
                    type: integer
                    minimum: 0
                additionalProperties: false
                required:
                  - items
                  - page
                  - pageSize
                  - total
        "400":
          $ref: '#/components/responses/Error400'
        "401":
