            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                active:
                  type: boolean
              additionalProperties: false
              minProperties: 1
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
