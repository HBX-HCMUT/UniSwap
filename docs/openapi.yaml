  /admin/stats:
    get:
      tags:
        - admin
      summary: Đếm tin, giao dịch và sinh viên theo kỳ
      operationId: getAdminStats
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: uniswap_session
  schemas:
    Ack:
      type: object
      properties:
        ok:
          type: boolean
      additionalProperties: false
      required:
        - ok
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
      additionalProperties: false
      required:
        - code
        - message
    School:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        code:
          type: string
          minLength: 1
          maxLength: 100
      additionalProperties: false
      required:
        - id
        - name
        - code
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        active:
          type: boolean
      additionalProperties: false
      required:
        - id
        - name
        - active
    PublicProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        schoolId:
          type: string
          format: uuid
          nullable: true
        averageRating:
          type: number
          nullable: true
        reviewCount:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
        - id
        - displayName
        - schoolId
        - averageRating
        - reviewCount
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        schoolId:
          type: string
          format: uuid
          nullable: true
        averageRating:
          type: number
          nullable: true
        reviewCount:
          type: integer
          minimum: 0
        email:
          type: string
          format: email
        area:
          type: string
          minLength: 1
          maxLength: 120
        contact:
          type: string
          minLength: 0
          maxLength: 200
        role:
          type: string
          enum:
            - STUDENT
            - ADMIN
      additionalProperties: false
      required:
        - id
        - displayName
        - schoolId
        - averageRating
        - reviewCount
        - email
        - role
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          enum:
            - ACTIVE
            - LOCKED
        role:
          type: string
          enum:
            - STUDENT
            - ADMIN
      additionalProperties: false
      required:
        - id
        - email
        - displayName
        - status
        - role
    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
          enum:
            - LISTING
            - PAYMENT_QR
        url:
          type: string
          format: uri-reference
      additionalProperties: false
      required:
        - id
        - purpose
        - url
    ListingInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 4000
        price:
          type: integer
          minimum: 0
          maximum: 2000000000
        condition:
          type: string
          enum:
            - LIKE_NEW
            - GOOD
            - FAIR
        categoryId:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        area:
          type: string
          minLength: 1
          maxLength: 120
        imageIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 6
          uniqueItems: true
      additionalProperties: false
      required:
        - title
        - description
        - price
        - condition
        - categoryId
        - schoolId
        - area
        - imageIds
    Listing:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 4000
        price:
          type: integer
          minimum: 0
          maximum: 2000000000
        condition:
          type: string
          enum:
            - LIKE_NEW
            - GOOD
            - FAIR
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
          minLength: 1
          maxLength: 100
          description: Tên hiện tại của danh mục, kể cả khi đã ngừng dùng.
        schoolId:
          type: string
          format: uuid
        area:
          type: string
          minLength: 1
          maxLength: 120
        id:
          type: string
          format: uuid
        seller:
          $ref: '#/components/schemas/PublicProfile'
        images:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
          minItems: 1
          maxItems: 6
        state:
          type: string
          enum:
            - AVAILABLE
            - RESERVED
            - SOLD
            - HIDDEN
        moderation:
          type: string
          enum:
            - APPROVED
            - PENDING
            - REMOVED
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
        - title
        - description
        - price
        - condition
        - categoryId
        - categoryName
        - schoolId
        - area
        - id
        - seller
        - images
        - state
        - moderation
        - createdAt
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        listingId:
          type: string
          format: uuid
        buyerId:
          type: string
          format: uuid
        sellerId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
        - id
        - listingId
        - buyerId
        - sellerId
        - createdAt
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
        - id
        - conversationId
        - senderId
        - text
        - createdAt
    Reservation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        listingId:
          type: string
          format: uuid
        buyerId:
          type: string
          format: uuid
        sellerId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - REJECTED
            - CANCELLED
            - COMPLETED
        createdAt:
          type: string
          format: date-time
        finalPrice:
          type: integer
          minimum: 0
          maximum: 2000000000
        meetingAt:
          type: string
          format: date-time
        meetingPlace:
          type: string
          minLength: 1
          maxLength: 120
        paymentMethod:
          type: string
          enum:
            - COD
            - QR_MANUAL
        qrAsset:
          allOf:
            - $ref: '#/components/schemas/Asset'
            - properties:
                purpose: {type: string, enum: [PAYMENT_QR]}
        completedAt:
          type: string
          format: date-time
        viewerHasReviewed:
          type: boolean
          description: Trong giao dịch COMPLETED, cho biết chủ phiên đã đánh giá đối tác.
      additionalProperties: false
      required:
        - id
        - listingId
        - buyerId
        - sellerId
        - state
        - createdAt
      oneOf:
        - description: Chưa từng chốt lịch.
          properties:
            state: {type: string, enum: [PENDING, REJECTED, CANCELLED]}
          not:
            anyOf:
              - required: [finalPrice]
              - required: [meetingAt]
              - required: [meetingPlace]
              - required: [paymentMethod]
              - required: [qrAsset]
        - description: Lịch đã hủy giữ thông tin hẹn. Phản hồi bỏ ảnh QR.
          properties:
            state: {type: string, enum: [CANCELLED]}
          required: [finalPrice, meetingAt, meetingPlace, paymentMethod]
          not: {required: [qrAsset]}
        - description: Hai bên xem được thông tin hẹn và ảnh của phương thức QR thủ công.
          properties:
            state: {type: string, enum: [ACCEPTED, COMPLETED]}
          required: [finalPrice, meetingAt, meetingPlace, paymentMethod]
          oneOf:
            - properties:
                paymentMethod: {type: string, enum: [COD]}
              not: {required: [qrAsset]}
            - properties:
                paymentMethod: {type: string, enum: [QR_MANUAL]}
              required: [qrAsset]
      allOf:
        - oneOf:
            - properties:
                state: {type: string, enum: [COMPLETED]}
              required: [completedAt, viewerHasReviewed]
            - not:
                anyOf:
                  - properties:
                      state: {type: string, enum: [COMPLETED]}
                  - required: [completedAt]
                  - required: [viewerHasReviewed]
    Review:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reservationId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        targetId:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          minLength: 0
          maxLength: 1000
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
        - id
        - reservationId
        - authorId
        - targetId
        - rating
        - createdAt
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - MESSAGE
            - RESERVATION
            - NEW_LISTING
            - MODERATION
        resourceId:
          type: string
          format: uuid
        text:
          type: string
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
        - id
        - kind
        - resourceId
        - text
        - readAt
        - createdAt
    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reporterId:
          type: string
          format: uuid
        listingId:
          type: string
          format: uuid
        reason:
          type: string
          enum:
            - SCAM
            - PROHIBITED
            - SPAM
            - OTHER
        details:
          type: string
          minLength: 1
          maxLength: 500
        state:
          type: string
          enum:
            - OPEN
            - DISMISSED
            - ACTIONED
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
        - id
        - reporterId
        - listingId
        - reason
        - state
        - createdAt
    Stats:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        listingCount:
          type: integer
          minimum: 0
        completedCount:
          type: integer
          minimum: 0
        activeStudentCount:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
        - from
        - to
        - listingCount
        - completedCount
        - activeStudentCount
    Saved:
      type: object
      properties:
        listings:
          type: array
          items:
            $ref: '#/components/schemas/Listing'
        sellers:
          type: array
          items:
            $ref: '#/components/schemas/PublicProfile'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      additionalProperties: false
      required:
        - listings
        - sellers
        - categories
  responses:
    Error400:
      description: Dữ liệu yêu cầu sai định dạng hoặc ngoài phạm vi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error401:
      description: Thiếu phiên hợp lệ hoặc sai thông tin đăng nhập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error403:
      description: Thiếu quyền, chưa xác thực hoặc tài khoản bị khóa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error404:
      description: Tài nguyên không tồn tại hoặc không hiển thị
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error409:
      description: Xung đột trạng thái hoặc bản ghi trùng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error410:
      description: Token hết hạn hoặc đã dùng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error413:
      description: Ảnh vượt giới hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error415:
      description: Định dạng ảnh không hỗ trợ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error422:
      description: Dữ liệu vi phạm quy tắc nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error429:
      description: Thao tác quá thường xuyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error503:
      description: Dịch vụ chưa sẵn sàng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
