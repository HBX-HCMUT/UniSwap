name: uniswap-agents
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: uniswap_demo
      POSTGRES_USER: uniswap
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Cần cấu hình môi trường local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - demo-data:/var/lib/postgresql/data
    healthcheck: &pghealth
      test: ["CMD-SHELL", "pg_isready -U uniswap -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: uniswap_test
      POSTGRES_USER: uniswap
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Cần cấu hình môi trường local}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - test-data:/var/lib/postgresql/data
    healthcheck: *pghealth
  mail:
    image: axllent/mailpit:v1.24
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"
volumes:
  demo-data:
  test-data:
