name: Deploy UniSwap trên EC2

on: workflow_dispatch

permissions: {}

concurrency:
  group: uniswap-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 38
    permissions:
      id-token: write
    env:
      AWS_PAGER: ''
      EC2_DEPLOY_REGION: ${{ vars.EC2_DEPLOY_REGION }}
      EC2_DEPLOY_INSTANCE_ID: ${{ vars.EC2_DEPLOY_INSTANCE_ID }}
      EC2_DEPLOY_ROLE_ARN: ${{ vars.EC2_DEPLOY_ROLE_ARN }}
    steps:
      - name: Kiểm tra biến triển khai
        shell: bash
        run: |
          : "${EC2_DEPLOY_REGION:?Cần đặt biến EC2_DEPLOY_REGION trong GitHub Actions.}"
          : "${EC2_DEPLOY_INSTANCE_ID:?Cần đặt biến EC2_DEPLOY_INSTANCE_ID trong GitHub Actions.}"
          : "${EC2_DEPLOY_ROLE_ARN:?Cần đặt biến EC2_DEPLOY_ROLE_ARN trong GitHub Actions.}"

      - name: Xác thực với AWS qua OIDC
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          aws-region: ${{ env.EC2_DEPLOY_REGION }}
          role-to-assume: ${{ env.EC2_DEPLOY_ROLE_ARN }}
          role-session-name: uniswap-deploy-${{ github.run_id }}

      - name: Triển khai trên EC2 và đợi smoke test
        shell: bash
        run: |
          set -euo pipefail

          command_id="$(aws ssm send-command \
            --document-name UniSwap-Deploy \
            --instance-ids "$EC2_DEPLOY_INSTANCE_ID" \
            --timeout-seconds 120 \
            --comment "UniSwap deploy, GitHub Actions run $GITHUB_RUN_ID" \
            --query 'Command.CommandId' \
            --output text)"
          printf 'SSM command ID %s\n' "$command_id"

          deadline=$((SECONDS + 1980))
          error_file="$RUNNER_TEMP/uniswap-ssm-error"
          while (( SECONDS < deadline )); do
            if invocation="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_DEPLOY_INSTANCE_ID" \
              --output json 2>"$error_file")"; then
              status="$(jq -r '.Status' <<< "$invocation")"
              case "$status" in
                Pending|InProgress|Delayed|Cancelling) ;;
                *)
                  printf 'Kết quả SSM %s\n' "$status"
                  jq -r '.StandardOutputContent, .StandardErrorContent | select(type == "string" and length > 0)' <<< "$invocation"
                  if [[ "$status" == Success ]]; then
                    exit 0
                  fi
                  exit 1
                  ;;
              esac
            elif ! grep -Fq InvocationDoesNotExist "$error_file"; then
              cat "$error_file" >&2
              exit 1
            fi
            sleep 10
          done
          printf 'Hết thời gian chờ SSM. Xem command ID %s trong Run Command.\n' "$command_id" >&2
          exit 1
