name: AI review

# Review tự động bằng DeepSeek. Cần secret DEEPSEEK_API_KEY (Settings → Secrets and
# variables → Actions). Có thể đổi model qua variable DEEPSEEK_MODEL (mặc định deepseek-chat).
# PR từ fork không nhận được secret nên bước review tự bỏ qua, không làm đỏ PR.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Số pull request cần review
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Kiểm tra kết nối gateway (tạm)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          BASE="${{ vars.DEEPSEEK_BASE_URL }}"
          BASE="${BASE:-https://api.deepseek.com}"
          MODEL="${{ vars.DEEPSEEK_MODEL }}"
          MODEL="${MODEL:-deepseek-chat}"
          code=$(curl -s -o /tmp/body.txt -w '%{http_code}' -X POST "$BASE/chat/completions" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
            -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":5}")
          echo "gateway HTTP: $code"
          head -c 120 /tmp/body.txt; echo
          printf '%s' "${DEEPSEEK_API_KEY}" | sha256sum
      - name: Gọi DeepSeek và cập nhật comment review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: node scripts/ai-review.mjs
