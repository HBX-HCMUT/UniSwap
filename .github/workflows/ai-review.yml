name: AI review

# Review tự động bằng DeepSeek. Cần secret DEEPSEEK_API_KEY (Settings → Secrets and
# variables → Actions). Có thể đổi model qua variable DEEPSEEK_MODEL (mặc định deepseek-chat).
# PR từ fork không nhận được secret nên bước review tự bỏ qua, không làm đỏ PR.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Số pull request cần review
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Gọi DeepSeek và cập nhật comment review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: node scripts/ai-review.mjs
